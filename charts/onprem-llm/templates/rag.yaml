{{- $v := .Values.rag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rag
  labels: {{- include "onprem-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
spec:
  {{- if not $v.autoscaling.enabled }}
  replicas: {{ $v.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "onprem-llm.selector" (dict "root" . "component" "rag") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "onprem-llm.labels" . | nindent 8 }}
        app.kubernetes.io/component: rag
        onprem-llm/model-client: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ $v.image }}
          imagePullPolicy: {{ $v.imagePullPolicy }}
          env: {{- include "onprem-llm.ragEnv" . | nindent 12 }}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources: {{- toYaml $v.resources | nindent 12 }}
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rag
  labels: {{- include "onprem-llm.labels" . | nindent 4 }}
spec:
  selector: {{- include "onprem-llm.selector" (dict "root" . "component" "rag") | nindent 4 }}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-rag
  labels: {{- include "onprem-llm.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "onprem-llm.selector" (dict "root" . "component" "rag") | nindent 6 }}
{{- if $v.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-rag
  labels: {{- include "onprem-llm.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }}-rag}
  minReplicas: {{ $v.autoscaling.minReplicas }}
  maxReplicas: {{ $v.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $v.autoscaling.targetCPU }}}}
{{- end }}
