{{- /* Optional llama.cpp servers next to the LLM: the guardrail classifier and the reranker. */ -}}
{{- range $name := list "guard" "rerank" }}
{{- $v := index $.Values $name }}
{{- if $v.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-models
  labels: {{- include "onprem-llm.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $v.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: {requests: {storage: {{ $v.storage.size }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "onprem-llm.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "onprem-llm.selector" (dict "root" $ "component" $name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "onprem-llm.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      initContainers:
        {{- include "onprem-llm.downloader" (dict "root" $ "model" $v.model) | nindent 8 }}
      containers:
        - name: server
          image: {{ $v.image }}
          args:
            - --model
            - /models/{{ $v.model.file }}
            - --alias
            - {{ $v.servedName }}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --threads
            - {{ $v.threads | quote }}
            - --metrics
            {{- range $v.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 120}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
          volumeMounts: [{name: models, mountPath: /models, readOnly: true}]
          resources: {{- toYaml $v.resources | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: {{ $.Release.Name }}-{{ $name }}-models}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "onprem-llm.labels" $ | nindent 4 }}
spec:
  selector: {{- include "onprem-llm.selector" (dict "root" $ "component" $name) | nindent 4 }}
  ports: [{name: http, port: 8080, targetPort: http}]
---
{{- end }}
{{- end }}
