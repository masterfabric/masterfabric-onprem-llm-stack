# Default values: CPU-only lab on k3d (Apple Silicon or any laptop). See values-vllm-gpu.yaml for GPU nodes.

# Model servers. Each one exposes the OpenAI API on port 8080 inside the cluster.
llm:
  backend: llamacpp            # llamacpp | vllm
  servedName: qwen2.5-1.5b-instruct
  replicas: 1
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-b12464
    model:
      file: qwen2.5-1.5b-instruct-q4_k_m.gguf
      url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
      sha256: ""               # optional pin; checked after download when set
    contextSize: 8192          # shared by all slots
    parallel: 4                # concurrent sequences (continuous batching)
    threads: 4
    extraArgs: []
  vllm:
    image: vllm/vllm-openai:v0.11.0
    model: Qwen/Qwen2.5-1.5B-Instruct
    maxModelLen: 4096
    gpuMemoryUtilization: 0.85
    extraArgs: []
  resources:
    requests: {cpu: "3", memory: 2Gi}
    limits: {cpu: "4", memory: 4Gi}
  storage: {size: 4Gi, storageClass: ""}
  nodeSelector: {}
  tolerations: []

embed:
  servedName: bge-small-en-v1.5
  dim: 384
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-b12464
  model:
    file: bge-small-en-v1.5-f16.gguf
    url: https://huggingface.co/CompendiumLabs/bge-small-en-v1.5-gguf/resolve/main/bge-small-en-v1.5-f16.gguf
    sha256: ""
  threads: 1
  resources:
    requests: {cpu: 500m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  storage: {size: 1Gi, storageClass: ""}

# Second input-guardrail layer: an LLM classifier (IBM Granite Guardian 3.2 3B-A800M, Apache-2.0).
guard:
  enabled: true
  servedName: granite-guardian-3.2-3b-a800m
  image: ghcr.io/ggml-org/llama.cpp:server-b12464
  model:
    file: granite-guardian-3.2-3b-a800m-Q4_K_M.gguf
    url: https://huggingface.co/ibm-research/granite-guardian-3.2-3b-a800m-GGUF/resolve/main/granite-guardian-3.2-3b-a800m-Q4_K_M.gguf
    sha256: 72735ad1cb9832df3141a4477cb1035228ba029e0b9076802305a07c870ccfb5
  threshold: 0.6              # frozen on the development set (ADR 0005)
  definition: override        # v1.1; "override_narrow" with threshold 0.55 is v1.2 (ADR 0008: more catches, more false blocks)
  failMode: closed            # closed: block when the classifier is unreachable; open: answer and log
  debugEndpoint: true         # POST /v1/guard returns the score (lab/evaluation only; disable in production)
  threads: 2
  extraArgs: [--ctx-size, "4096", --parallel, "2"]
  resources:
    requests: {cpu: 500m, memory: 2560Mi}
    limits: {cpu: "2", memory: 4Gi}   # 3Gi was OOMKilled during evaluation runs (ADR 0008)
  storage: {size: 3Gi, storageClass: ""}

# Cross-encoder reranker (BAAI bge-reranker-v2-m3, Apache-2.0) over the top RERANK_CANDIDATES chunks.
rerank:
  enabled: true
  # rerank only when the request asks for it ({"rerank": true}); see ADR 0006 for the measured trade-off
  default: false
  servedName: bge-reranker-v2-m3
  image: ghcr.io/ggml-org/llama.cpp:server-b12464
  model:
    file: bge-reranker-v2-m3-Q8_0.gguf
    url: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf
    sha256: a43c7c9b11a4c1517e5bf95151960e1621d1b72f7a493364b01e386cf1aaa1d3
  candidates: 12
  threads: 2
  extraArgs: [--reranking, --ctx-size, "8192", --batch-size, "8192", --ubatch-size, "8192", --parallel, "1"]
  resources:
    requests: {cpu: 500m, memory: 768Mi}
    limits: {cpu: "2", memory: 1536Mi}
  storage: {size: 1Gi, storageClass: ""}

# Prometheus + Grafana inside the release (lab). In production use the cluster's monitoring stack and
# keep only the scrape annotations and the dashboard JSON.
monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v3.16.0
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  grafana:
    image: grafana/grafana:13.2.6
    anonymousViewer: true     # lab only: reachable through kubectl port-forward on 127.0.0.1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 384Mi}

modelDownloader:
  image: curlimages/curl:8.11.1

pgvector:
  image: pgvector/pgvector:pg16
  database: rag
  user: rag
  existingSecret: ""           # secret with key "password"; generated when empty
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  storage: {size: 2Gi, storageClass: ""}

rag:
  image: mf-rag-api:dev
  imagePullPolicy: IfNotPresent
  replicas: 1
  topK: 4
  minScore: 0.55
  maxTokens: 200
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPU: 70
  ingestOnInstall: true        # post-install/upgrade Job that loads corpus/ into pgvector

ingress:
  enabled: true
  className: traefik
  host: ""                     # empty = any host (the lab uses 127.0.0.1:48080)
  path: /

networkPolicy:
  enabled: true                # only the RAG API (and the ingest job) may reach models and database

podSecurity:
  runAsNonRoot: true
