# Local single-node Kubernetes (k3s in Docker) for the lab.
# Only the ingress is published, on 127.0.0.1:48080. Nothing listens on other interfaces.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: mf-llm
servers: 1
agents: 0
image: rancher/k3s:v1.31.6-k3s1
ports:
  - port: 127.0.0.1:48080:80
    nodeFilters: [loadbalancer]
options:
  k3d:
    wait: true
    timeout: "180s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
